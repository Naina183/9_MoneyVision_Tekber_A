<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyVision</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2e3348;
    --text: #e4e6ef;
    --text2: #8b8fa8;
    --accent: #6c8cff;
    --green: #4ade80;
    --orange: #fb923c;
    --red: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .auto-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    background: rgba(74, 222, 128, 0.12);
    color: var(--green);
    border: 1px solid rgba(74, 222, 128, 0.25);
  }

  .auto-badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--surface);
    border-radius: 12px;
    padding: 4px;
    border: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    padding: 10px 20px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--text2);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }

  .tab.active {
    background: var(--accent);
    color: #fff;
  }

  .tab:hover:not(.active) {
    background: var(--surface2);
    color: var(--text);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* -- webcam panel -- */
  .video-container {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid var(--border);
    background: #000;
  }

  .video-container img {
    width: 100%;
    display: block;
  }

  .scan-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }

  .scan-btn:hover {
    background: var(--surface2);
    border-color: var(--accent);
  }

  .scan-btn:active {
    transform: scale(0.98);
  }

  /* -- upload panel -- */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 60px 24px;
    text-align: center;
    cursor: pointer;
    transition: all .25s;
    background: var(--surface);
  }

  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(108, 140, 255, 0.06);
  }

  .upload-zone .icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .upload-zone p { color: var(--text2); margin-top: 8px; font-size: 14px; }

  .upload-zone input { display: none; }

  .upload-preview {
    display: none;
    margin-top: 16px;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid var(--border);
    background: #000;
  }

  .upload-preview img {
    width: 100%;
    display: block;
  }

  /* -- result card -- */
  .result-card {
    margin-top: 20px;
    padding: 20px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .result-card.hidden { display: none; }

  .result-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    font-weight: 700;
    font-size: 16px;
  }

  .result-header .indicator {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--green);
  }

  .result-notes {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .note-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .note-nominal {
    font-size: 20px;
    font-weight: 700;
    color: var(--green);
  }

  .note-nominal.unknown {
    color: var(--orange);
    font-size: 16px;
  }

  .note-meta {
    font-size: 12px;
    color: var(--text2);
  }

  .status-bar {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    background: var(--surface2);
    font-size: 14px;
    color: var(--text2);
    text-align: center;
  }

  .footer {
    margin-top: 32px;
    padding: 16px;
    text-align: center;
    color: var(--text2);
    font-size: 12px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 640px) {
    .main { padding: 12px; }
    .header { padding: 12px 16px; }
    .logo { font-size: 18px; }
    .note-nominal { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">💵</div>
    MoneyVision
  </div>
  <div class="auto-badge">
    <span class="dot"></span>
    Auto-scan
  </div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('webcam')">Webcam</button>
    <button class="tab" onclick="switchTab('upload')">Upload Gambar</button>
  </div>

  <!-- webcam panel -->
  <div id="panel-webcam" class="panel active">
    <div class="video-container">
      <img id="video-feed" src="/video_feed" alt="webcam">
    </div>
    <button class="scan-btn" onclick="manualScan()">Scan Manual</button>
  </div>

  <!-- upload panel -->
  <div id="panel-upload" class="panel">
    <div class="upload-zone" id="upload-zone">
      <div class="icon">📤</div>
      <strong>Klik atau seret gambar ke sini</strong>
      <p>Mendukung JPG, PNG, BMP</p>
      <input type="file" id="file-input" accept="image/*">
    </div>
    <div class="upload-preview" id="upload-preview">
      <img id="upload-result" alt="hasil upload">
    </div>
  </div>

  <!-- result card -->
  <div class="result-card hidden" id="result-card">
    <div class="result-header">
      <div class="indicator"></div>
      <span>Hasil Deteksi</span>
    </div>
    <div class="result-notes" id="result-notes"></div>
  </div>

  <div class="status-bar" id="status-bar">
    Arahkan uang ke kamera. Scan otomatis aktif.
  </div>
</div>

<div class="footer">
  MoneyVision &mdash; Pengenalan Nominal Uang Kertas Indonesia &bull; OpenCV + ORB Feature Matching
</div>

<script>
  let currentTab = 'webcam';
  let pollInterval = null;

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    if (tab === 'webcam') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('panel-webcam').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('panel-upload').classList.add('active');
    }
  }

  // -- auto-scan status polling --
  function startPoll() {
    if (pollInterval) return;
    pollInterval = setInterval(async () => {
      if (currentTab !== 'webcam') return;
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        updateResults(data);
      } catch(e) {}
    }, 800);
  }

  function updateResults(data) {
    const bar = document.getElementById('status-bar');
    bar.textContent = data.message || '';

    const card = document.getElementById('result-card');
    const notesEl = document.getElementById('result-notes');

    if (!data.notes || data.notes.length === 0) {
      card.classList.add('hidden');
      return;
    }

    card.classList.remove('hidden');
    notesEl.innerHTML = '';
    data.notes.forEach(n => {
      const div = document.createElement('div');
      div.className = 'note-item';
      if (n.known) {
        div.innerHTML = `
          <span class="note-nominal">${n.nominal}</span>
          <span class="note-meta">${n.method} &bull; ${(n.confidence * 100).toFixed(0)}%</span>
        `;
      } else {
        div.innerHTML = `<span class="note-nominal unknown">Tidak dikenali</span>`;
      }
      notesEl.appendChild(div);
    });
  }

  // -- manual scan --
  async function manualScan() {
    try {
      const res = await fetch('/api/scan', { method: 'POST' });
      const data = await res.json();
      updateResults(data);
    } catch(e) {
      document.getElementById('status-bar').textContent = 'Gagal scan: ' + e.message;
    }
  }

  // -- upload --
  const uploadZone = document.getElementById('upload-zone');
  const fileInput = document.getElementById('file-input');

  uploadZone.addEventListener('click', () => fileInput.click());

  uploadZone.addEventListener('dragover', e => {
    e.preventDefault();
    uploadZone.classList.add('dragover');
  });

  uploadZone.addEventListener('dragleave', () => {
    uploadZone.classList.remove('dragover');
  });

  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) uploadFile(fileInput.files[0]);
  });

  async function uploadFile(file) {
    const bar = document.getElementById('status-bar');
    bar.textContent = 'Memproses gambar...';

    const form = new FormData();
    form.append('image', file);

    try {
      const res = await fetch('/api/upload', { method: 'POST', body: form });
      const data = await res.json();

      if (data.result_image) {
        const preview = document.getElementById('upload-preview');
        const img = document.getElementById('upload-result');
        img.src = data.result_image;
        preview.style.display = 'block';
      }

      updateResults(data);
      if (data.processing_ms) {
        bar.textContent = `${data.message} (${data.processing_ms.toFixed(0)} ms)`;
      }
    } catch(e) {
      bar.textContent = 'Gagal upload: ' + e.message;
    }
  }

  // start
  startPoll();
</script>
</body>
</html>
